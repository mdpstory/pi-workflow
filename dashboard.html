<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pi-workflow dashboard</title>
<style>
/*
  Design tokens
  -------------
  Space: 4px grid — 4 8 12 16 24
  Type:  sm=11px  base=13px  lg=15px
  Color: neutral greys + single blue accent
*/
:root {
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-6: 24px;
  --text-sm: 11px; --text-base: 13px; --text-lg: 15px;
  --line: 1.5;
  --radius: 6px; --radius-sm: 3px;
  --border: #e0e0e0;
  --surface: #fff;
  --bg: #f2f2f2;
  --text: #1a1a1a;
  --text-muted: #888;
  --text-faint: #bbb;
  --accent: #1a73e8;
  --accent-bg: #e8f0fe;
  --warn: #f59e0b;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --mono: ui-monospace, "Cascadia Code", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: var(--text-base);
  line-height: var(--line);
  background: var(--bg);
  color: var(--text);
  padding: var(--sp-6);
  max-width: 1200px;
  margin: 0 auto;
}

/* header */
h1 { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--sp-1); }
#meta { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--sp-6); }
.empty { color: var(--text-muted); font-style: italic; }

/* cards */
.cards { display: flex; flex-direction: column; gap: var(--sp-6); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.card.finished { opacity: 0.5; }

/* card header */
.card-head {
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.repo-name { font-size: var(--text-base); font-weight: 600; }
.repo-path { font-size: var(--text-sm); color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  font-size: var(--text-sm); font-weight: 500;
  padding: var(--sp-1) var(--sp-2);
  border-radius: 999px;
  flex-shrink: 0;
}
.badge.live    { background: var(--accent-bg); color: var(--accent); }
.badge.finished { background: var(--bg); color: var(--text-muted); }

/* two-column body */
.card-body { display: grid; grid-template-columns: 1fr 1fr; }
.col { padding: var(--sp-4); }
.col + .col { border-left: 1px solid var(--border); }

/* sections */
.section { margin-bottom: var(--sp-4); }
.section:last-child { margin-bottom: 0; }
.label {
  font-size: var(--text-sm); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: var(--sp-2);
}

/* stages */
.stages { display: flex; flex-direction: column; gap: var(--sp-1); }
.stage-row {
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: var(--text-sm);
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--radius-sm);
}
.stage-row.current  { background: var(--accent-bg); font-weight: 600; }
.stage-row.done     { color: var(--text-muted); }
.stage-row.blocked  { background: var(--danger-bg); }
.stage-row.failed   { background: var(--danger-bg); }
.stage-emoji { width: 16px; text-align: center; flex-shrink: 0; }
.stage-name  { flex: 1; }
.stage-sha   { font-size: var(--text-sm); color: var(--text-faint); font-family: var(--mono); }

/* budget */
.budget-text { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--sp-1); }
.bar { height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s; }
.bar-fill.warn   { background: var(--warn); }
.bar-fill.danger { background: var(--danger); }

/* activity feed */
.feed { display: flex; flex-direction: column; gap: var(--sp-1); }
.feed-item {
  font-size: var(--text-sm); font-family: var(--mono);
  color: var(--text-muted);
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--radius-sm);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.feed-item.latest { background: var(--bg); color: var(--text); font-weight: 600; }
.feed-empty { font-size: var(--text-sm); color: var(--text-faint); font-style: italic; }

/* CLRs */
.clr-item { padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); }
.clr-item:last-child { border: none; padding-bottom: 0; }
.clr-id    { font-size: var(--text-sm); font-weight: 700; color: var(--danger); }
.clr-stage { font-size: var(--text-sm); color: var(--text-muted); margin-left: var(--sp-1); }
.clr-q     { font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--sp-1); }
.none-text { font-size: var(--text-sm); color: var(--text-faint); font-style: italic; }

/* artifacts */
.artifacts { display: flex; flex-direction: column; gap: var(--sp-2); }
details { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
details[open] { border-color: #ccc; }
summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--text-sm); font-weight: 600;
  color: var(--text);
  background: var(--bg);
  user-select: none;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: "▸"; color: var(--text-faint); font-size: 10px; }
details[open] summary::after { content: "▾"; }
summary:hover { background: var(--border); }

/* markdown body */
.md-body {
  padding: var(--sp-3);
  font-size: var(--text-sm);
  line-height: var(--line);
  max-height: 400px;
  overflow-y: auto;
}
.md-body h1, .md-body h2 {
  font-size: var(--text-base); font-weight: 600;
  margin: var(--sp-3) 0 var(--sp-1);
  padding-bottom: var(--sp-1);
  border-bottom: 1px solid var(--border);
}
.md-body h1:first-child, .md-body h2:first-child { margin-top: 0; }
.md-body h3, .md-body h4 { font-size: var(--text-sm); font-weight: 600; margin: var(--sp-2) 0 var(--sp-1); }
.md-body p  { margin: var(--sp-2) 0; }
.md-body ul, .md-body ol { padding-left: var(--sp-4); margin: var(--sp-1) 0; }
.md-body li { margin: var(--sp-1) 0; }
.md-body code {
  font-family: var(--mono); font-size: var(--text-sm);
  background: var(--bg); padding: 1px var(--sp-1); border-radius: var(--radius-sm);
}
.md-body pre {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--sp-2) var(--sp-3);
  overflow-x: auto; margin: var(--sp-2) 0;
}
.md-body pre code { background: none; padding: 0; }
.md-body table { border-collapse: collapse; width: 100%; margin: var(--sp-2) 0; }
.md-body th, .md-body td { border: 1px solid var(--border); padding: var(--sp-1) var(--sp-2); text-align: left; }
.md-body th { background: var(--bg); font-weight: 600; }
.md-body blockquote { border-left: 3px solid var(--border); padding-left: var(--sp-3); color: var(--text-muted); margin: var(--sp-2) 0; }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: var(--sp-3) 0; }

/* card footer */
.ts {
  font-size: var(--text-sm); color: var(--text-faint);
  padding: var(--sp-2) var(--sp-4);
  border-top: 1px solid var(--border);
  background: var(--bg);
}
</style>
</head>
<body>
<h1>pi-workflow</h1>
<div id="meta">connecting…</div>
<div id="root"><p class="empty">No active workflows.</p></div>
<script>
const STAGES = ["planning","research","task-breakdown","architecture","implementation","review","testing","documentation"];
const EMOJI = {todo:"⬜","in-progress":"⏳",done:"✅",blocked:"🔴",retry:"🔁",failed:"❌"};

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function inline(s) {
  const BT = String.fromCharCode(96);
  const re = new RegExp(BT + "([^" + BT + "]+)" + BT, "g");
  return esc(s)
    .replace(re, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/__([^_]+)__/g, "<strong>$1</strong>")
    .replace(/_([^_]+)_/g, "<em>$1</em>");
}

function renderMd(src) {
  if (!src) return "";
  const BT3 = String.fromCharCode(96,96,96);
  const lines = src.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith(BT3)) {
      const lang = line.slice(3).trim();
      let code = "";
      i++;
      while (i < lines.length && !lines[i].startsWith(BT3)) { code += esc(lines[i]) + "\n"; i++; }
      out += "<pre><code" + (lang ? ' class="lang-' + esc(lang) + '"' : "") + ">" + code + "</code></pre>";
      i++; continue;
    }
    const hm = line.match(/^(#{1,4})\s+(.*)/);
    if (hm) { const lvl = Math.min(hm[1].length + 1, 4); out += "<h" + lvl + ">" + inline(hm[2]) + "</h" + lvl + ">"; i++; continue; }
    if (/^[-*_]{3,}$/.test(line.trim())) { out += "<hr>"; i++; continue; }
    if (line.startsWith("> ")) { out += "<blockquote>" + inline(line.slice(2)) + "</blockquote>"; i++; continue; }
    if (line.includes("|") && i + 1 < lines.length && /^[\s|:-]+$/.test(lines[i+1])) {
      const headers = line.split("|").filter((_,j,a)=>j>0&&j<a.length-1).map(c=>c.trim());
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes("|")) {
        rows.push(lines[i].split("|").filter((_,j,a)=>j>0&&j<a.length-1).map(c=>c.trim())); i++;
      }
      out += "<table><thead><tr>" + headers.map(h=>"<th>"+inline(h)+"</th>").join("") + "</tr></thead><tbody>";
      out += rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("") + "</tbody></table>";
      continue;
    }
    if (/^[-*+] /.test(line)) {
      out += "<ul>";
      while (i < lines.length && /^[-*+] /.test(lines[i])) { out += "<li>" + inline(lines[i].replace(/^[-*+] /,"")) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    if (/^\d+\. /.test(line)) {
      out += "<ol>";
      while (i < lines.length && /^\d+\. /.test(lines[i])) { out += "<li>" + inline(lines[i].replace(/^\d+\. /,"")) + "</li>"; i++; }
      out += "</ol>"; continue;
    }
    if (line.trim() === "" || line.startsWith("<!--")) { i++; continue; }
    out += "<p>" + inline(line) + "</p>"; i++;
  }
  return out;
}

const ARTIFACT_STAGE = {
  "plan.md":"planning","tasks.md":"task-breakdown","research.md":"research",
  "architecture.md":"architecture","decisions.md":"architecture",
  "review.md":"review","test-report.md":"testing","changelog.md":"documentation"
};
const ACTIVE = new Set(["in-progress","done"]);

function renderCard(s) {
  const finished = s.finished;
  const stages = s.state && s.state.stages ? s.state.stages : {};
  const current = s.state && s.state.current;
  const clrs = s.clr && s.clr.open ? s.clr.open : [];
  const artifacts = s.artifacts || {};
  const tc = s.toolCalls || 0;
  const cap = s.toolCap || 50;
  const pct = Math.min(100, Math.round(tc / cap * 100));
  const fillCls = pct >= 90 ? "danger" : pct >= 70 ? "warn" : "";
  const activity = s.activity || [];

  const stagesHtml = STAGES.map(function(name) {
    const st = stages[name] || {status:"todo"};
    const isCur = name === current;
    const cls = ["stage-row", isCur ? "current" : "", st.status !== "todo" ? st.status : ""].filter(Boolean).join(" ");
    const sha = st.sha ? '<span class="stage-sha">' + esc(st.sha.slice(0,7)) + "</span>" : "";
    return '<div class="' + cls + '"><span class="stage-emoji">' + (EMOJI[st.status]||"?") + '</span><span class="stage-name">' + esc(name) + "</span>" + sha + "</div>";
  }).join("");

  const feedHtml = activity.length
    ? activity.map(function(a,idx) {
        return '<div class="feed-item' + (idx===0?" latest":"") + '" style="' + (idx>0?"opacity:"+(Math.max(0.3,1-idx*0.1)):"")+'">' + esc(a) + "</div>";
      }).join("")
    : '<div class="feed-empty">no activity yet</div>';

  const clrHtml = clrs.length
    ? clrs.map(function(c) {
        return '<div class="clr-item"><span class="clr-id">' + esc(c.id) + '</span><span class="clr-stage">[' + esc(c.stage) + ']</span><div class="clr-q">' + esc(c.question||"") + "</div></div>";
      }).join("")
    : '<span class="none-text">none</span>';

  const artifactHtml = Object.keys(artifacts).map(function(name) {
    const content = artifacts[name];
    if (!content || content.includes("_empty_") || content.trim().length < 10) return "";
    const ownerStage = ARTIFACT_STAGE[name];
    const isActive = ownerStage && ACTIVE.has(stages[ownerStage] && stages[ownerStage].status);
    return "<details" + (isActive ? " open" : "") + "><summary>" + esc(name) + "</summary><div class=\"md-body\">" + renderMd(content) + "</div></details>";
  }).filter(Boolean).join("");

  const ts = s.lastSeen ? new Date(s.lastSeen).toLocaleTimeString() : "";

  return '<div class="card' + (finished?" finished":"") + '">'
    + '<div class="card-head">'
    + '<span class="repo-name">' + esc(s.repoName) + '</span>'
    + '<span class="repo-path">' + esc(s.cwd) + '</span>'
    + '<span class="badge ' + (finished?"finished":"live") + '">' + (finished?"FINISHED":"LIVE") + '</span>'
    + '</div>'
    + '<div class="card-body">'
    + '<div class="col">'
    + '<div class="section"><div class="label">Stages</div><div class="stages">' + stagesHtml + '</div></div>'
    + '<div class="section"><div class="label">Tool budget</div>'
    + '<div class="budget-text">' + tc + ' / ' + cap + ' calls this stage</div>'
    + '<div class="bar"><div class="bar-fill ' + fillCls + '" style="width:' + pct + '%"></div></div></div>'
    + '<div class="section"><div class="label">Agent activity</div><div class="feed">' + feedHtml + '</div></div>'
    + '</div>'
    + '<div class="col">'
    + '<div class="section"><div class="label">Open CLRs</div>' + clrHtml + '</div>'
    + (artifactHtml ? '<div class="section"><div class="label">Artifacts</div><div class="artifacts">' + artifactHtml + '</div></div>' : '')
    + '</div>'
    + '</div>'
    + '<div class="ts">Updated ' + ts + '</div>'
    + '</div>';
}

function render(sessions) {
  var root = document.getElementById("root");
  if (!sessions.length) { root.innerHTML = '<p class="empty">No active workflows.</p>'; return; }
  root.innerHTML = '<div class="cards">' + sessions.map(renderCard).join("") + '</div>';
}

var es = new EventSource("/events");
es.onopen = function() { document.getElementById("meta").textContent = "live"; };
es.onerror = function() { document.getElementById("meta").textContent = "disconnected — retrying…"; };
es.onmessage = function(e) {
  try {
    render(JSON.parse(e.data));
    document.getElementById("meta").textContent = "live · " + new Date().toLocaleTimeString();
  } catch(err) {}
};
</script>
</body>
</html>
