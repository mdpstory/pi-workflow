<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pi-workflow dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; font-size: 14px; background: #f0f0f0; color: #111; padding: 20px; }
h1 { font-size: 18px; margin-bottom: 4px; }
#meta { font-size: 12px; color: #888; margin-bottom: 20px; }
.empty { color: #888; font-style: italic; }
.cards { display: flex; flex-direction: column; gap: 20px; }
.card { background: #fff; border: 1px solid #d0d0d0; border-radius: 8px; overflow: hidden; }
.card.finished { opacity: 0.55; }
.card-head { padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; align-items: baseline; gap: 10px; }
.repo-name { font-size: 15px; font-weight: 600; }
.repo-path { font-size: 11px; color: #999; flex: 1; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; }
.badge.finished { background: #eee; color: #888; }
.badge.live { background: #e3f2fd; color: #1565c0; }
.card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.col { padding: 14px 16px; }
.col + .col { border-left: 1px solid #eee; }
.section { margin-bottom: 14px; }
.section:last-child { margin-bottom: 0; }
.label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #999; margin-bottom: 6px; }
.stages { display: flex; flex-direction: column; gap: 4px; }
.stage-row { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 6px; border-radius: 4px; }
.stage-row.current { background: #e8f0fe; font-weight: 600; }
.stage-row.done { color: #777; }
.stage-row.blocked { background: #fff0f0; }
.stage-row.failed { background: #ffe0e0; }
.stage-emoji { width: 16px; text-align: center; flex-shrink: 0; }
.stage-name { flex: 1; }
.stage-sha { font-size: 10px; color: #bbb; font-family: monospace; }
.budget-line { font-size: 12px; display: flex; align-items: center; gap: 8px; }
.bar { flex: 1; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: #1a73e8; transition: width .3s; }
.bar-fill.warn { background: #f9a825; }
.bar-fill.danger { background: #c62828; }
.feed { display: flex; flex-direction: column; gap: 3px; }
.feed-item { font-size: 11px; font-family: monospace; color: #444; padding: 2px 4px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-item.latest { background: #f5f5f5; color: #111; font-weight: 600; }
.feed-empty { font-size: 11px; color: #ccc; font-style: italic; }
.clr-item { font-size: 12px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
.clr-item:last-child { border: none; }
.clr-id { font-weight: 700; color: #c62828; }
.clr-stage { font-size: 10px; color: #999; margin-left: 4px; }
.clr-q { color: #444; margin-top: 2px; }
.none-text { font-size: 11px; color: #ccc; font-style: italic; }
.artifacts { display: flex; flex-direction: column; gap: 8px; }
details { border: 1px solid #eee; border-radius: 4px; overflow: hidden; }
details[open] { border-color: #d0d0d0; }
summary { cursor: pointer; padding: 6px 10px; font-size: 12px; font-weight: 600; color: #333; background: #fafafa; user-select: none; list-style: none; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "▸"; color: #bbb; }
details[open] summary::after { content: "▾"; }
summary:hover { background: #f0f0f0; }
.md-body { padding: 10px 12px; font-size: 12px; line-height: 1.6; overflow-x: auto; max-height: 400px; overflow-y: auto; }
.md-body h1,.md-body h2 { font-size: 14px; margin: 10px 0 4px; border-bottom: 1px solid #eee; padding-bottom: 3px; }
.md-body h3,.md-body h4 { font-size: 13px; margin: 8px 0 3px; }
.md-body p { margin: 6px 0; }
.md-body ul,.md-body ol { padding-left: 18px; margin: 4px 0; }
.md-body li { margin: 2px 0; }
.md-body code { font-family: monospace; background: #f4f4f4; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
.md-body pre { background: #f6f6f6; border: 1px solid #eee; border-radius: 4px; padding: 8px; overflow-x: auto; margin: 6px 0; }
.md-body pre code { background: none; padding: 0; font-size: 11px; }
.md-body table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 11px; }
.md-body th,.md-body td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
.md-body th { background: #f5f5f5; font-weight: 600; }
.md-body blockquote { border-left: 3px solid #ddd; margin: 6px 0; padding-left: 10px; color: #666; }
.md-body hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
.ts { font-size: 10px; color: #ccc; padding: 6px 16px 10px; }
</style>
</head>
<body>
<h1>pi-workflow</h1>
<div id="meta">connecting…</div>
<div id="root"><p class="empty">No active workflows.</p></div>
<script>
const STAGES = ["planning","research","task-breakdown","architecture","implementation","review","testing","documentation"];
const EMOJI = {todo:"⬜","in-progress":"⏳",done:"✅",blocked:"🔴",retry:"🔁",failed:"❌"};

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function inline(s) {
  const BT = String.fromCharCode(96);
  const re = new RegExp(BT + "([^" + BT + "]+)" + BT, "g");
  return esc(s)
    .replace(re, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/__([^_]+)__/g, "<strong>$1</strong>")
    .replace(/_([^_]+)_/g, "<em>$1</em>");
}

function renderMd(src) {
  if (!src) return "";
  const BT3 = String.fromCharCode(96,96,96);
  const lines = src.split("\n");
  let out = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith(BT3)) {
      const lang = line.slice(3).trim();
      let code = "";
      i++;
      while (i < lines.length && !lines[i].startsWith(BT3)) { code += esc(lines[i]) + "\n"; i++; }
      out += "<pre><code" + (lang ? ' class="lang-' + esc(lang) + '"' : "") + ">" + code + "</code></pre>";
      i++; continue;
    }
    const hm = line.match(/^(#{1,4})\s+(.*)/);
    if (hm) { const lvl = Math.min(hm[1].length + 1, 4); out += "<h" + lvl + ">" + inline(hm[2]) + "</h" + lvl + ">"; i++; continue; }
    if (/^[-*_]{3,}$/.test(line.trim())) { out += "<hr>"; i++; continue; }
    if (line.startsWith("> ")) { out += "<blockquote>" + inline(line.slice(2)) + "</blockquote>"; i++; continue; }
    if (line.includes("|") && i + 1 < lines.length && /^[\s|:-]+$/.test(lines[i+1])) {
      const headers = line.split("|").filter((_,j,a)=>j>0&&j<a.length-1).map(c=>c.trim());
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes("|")) {
        rows.push(lines[i].split("|").filter((_,j,a)=>j>0&&j<a.length-1).map(c=>c.trim())); i++;
      }
      out += "<table><thead><tr>" + headers.map(h=>"<th>"+inline(h)+"</th>").join("") + "</tr></thead><tbody>";
      out += rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("") + "</tbody></table>";
      continue;
    }
    if (/^[-*+] /.test(line)) {
      out += "<ul>";
      while (i < lines.length && /^[-*+] /.test(lines[i])) { out += "<li>" + inline(lines[i].replace(/^[-*+] /,"")) + "</li>"; i++; }
      out += "</ul>"; continue;
    }
    if (/^\d+\. /.test(line)) {
      out += "<ol>";
      while (i < lines.length && /^\d+\. /.test(lines[i])) { out += "<li>" + inline(lines[i].replace(/^\d+\. /,"")) + "</li>"; i++; }
      out += "</ol>"; continue;
    }
    if (line.trim() === "" || line.startsWith("<!--")) { i++; continue; }
    out += "<p>" + inline(line) + "</p>"; i++;
  }
  return out;
}

const ARTIFACT_STAGE = {
  "plan.md":"planning","tasks.md":"task-breakdown","research.md":"research",
  "architecture.md":"architecture","decisions.md":"architecture",
  "review.md":"review","test-report.md":"testing","changelog.md":"documentation"
};
const ACTIVE = new Set(["in-progress","done"]);

function renderCard(s) {
  const finished = s.finished;
  const stages = s.state && s.state.stages ? s.state.stages : {};
  const current = s.state && s.state.current;
  const clrs = s.clr && s.clr.open ? s.clr.open : [];
  const artifacts = s.artifacts || {};
  const tc = s.toolCalls || 0;
  const cap = s.toolCap || 50;
  const pct = Math.min(100, Math.round(tc / cap * 100));
  const fillCls = pct >= 90 ? "danger" : pct >= 70 ? "warn" : "";
  const activity = s.activity || [];

  const stagesHtml = STAGES.map(function(name) {
    const st = stages[name] || {status:"todo"};
    const isCur = name === current;
    const cls = ["stage-row", isCur ? "current" : "", st.status !== "todo" ? st.status : ""].filter(Boolean).join(" ");
    const sha = st.sha ? '<span class="stage-sha">' + esc(st.sha.slice(0,7)) + "</span>" : "";
    return '<div class="' + cls + '"><span class="stage-emoji">' + (EMOJI[st.status]||"?") + '</span><span class="stage-name">' + esc(name) + "</span>" + sha + "</div>";
  }).join("");

  const feedHtml = activity.length
    ? activity.map(function(a,idx) {
        return '<div class="feed-item' + (idx===0?" latest":"") + '" style="' + (idx>0?"opacity:"+(Math.max(0.3,1-idx*0.1)):"")+'">' + esc(a) + "</div>";
      }).join("")
    : '<div class="feed-empty">no activity yet</div>';

  const clrHtml = clrs.length
    ? clrs.map(function(c) {
        return '<div class="clr-item"><span class="clr-id">' + esc(c.id) + '</span><span class="clr-stage">[' + esc(c.stage) + ']</span><div class="clr-q">' + esc(c.question||"") + "</div></div>";
      }).join("")
    : '<span class="none-text">none</span>';

  const artifactHtml = Object.keys(artifacts).map(function(name) {
    const content = artifacts[name];
    if (!content || content.includes("_empty_") || content.trim().length < 10) return "";
    const ownerStage = ARTIFACT_STAGE[name];
    const isActive = ownerStage && ACTIVE.has(stages[ownerStage] && stages[ownerStage].status);
    return "<details" + (isActive ? " open" : "") + "><summary>" + esc(name) + "</summary><div class=\"md-body\">" + renderMd(content) + "</div></details>";
  }).filter(Boolean).join("");

  const ts = s.lastSeen ? new Date(s.lastSeen).toLocaleTimeString() : "";

  return '<div class="card' + (finished?" finished":"") + '">'
    + '<div class="card-head">'
    + '<span class="repo-name">' + esc(s.repoName) + '</span>'
    + '<span class="repo-path">' + esc(s.cwd) + '</span>'
    + '<span class="badge ' + (finished?"finished":"live") + '">' + (finished?"FINISHED":"LIVE") + '</span>'
    + '</div>'
    + '<div class="card-body">'
    + '<div class="col">'
    + '<div class="section"><div class="label">Stages</div><div class="stages">' + stagesHtml + '</div></div>'
    + '<div class="section"><div class="label">Tool budget — ' + tc + ' / ' + cap + '</div>'
    + '<div class="budget-line"><div class="bar"><div class="bar-fill ' + fillCls + '" style="width:' + pct + '%"></div></div></div></div>'
    + '<div class="section"><div class="label">Agent activity</div><div class="feed">' + feedHtml + '</div></div>'
    + '</div>'
    + '<div class="col">'
    + '<div class="section"><div class="label">Open CLRs</div>' + clrHtml + '</div>'
    + (artifactHtml ? '<div class="section"><div class="label">Artifacts</div><div class="artifacts">' + artifactHtml + '</div></div>' : '')
    + '</div>'
    + '</div>'
    + '<div class="ts">Updated ' + ts + '</div>'
    + '</div>';
}

function render(sessions) {
  var root = document.getElementById("root");
  if (!sessions.length) { root.innerHTML = '<p class="empty">No active workflows.</p>'; return; }
  root.innerHTML = '<div class="cards">' + sessions.map(renderCard).join("") + '</div>';
}

var es = new EventSource("/events");
es.onopen = function() { document.getElementById("meta").textContent = "live"; };
es.onerror = function() { document.getElementById("meta").textContent = "disconnected — retrying…"; };
es.onmessage = function(e) {
  try {
    render(JSON.parse(e.data));
    document.getElementById("meta").textContent = "live · " + new Date().toLocaleTimeString();
  } catch(err) {}
};
</script>
</body>
</html>
